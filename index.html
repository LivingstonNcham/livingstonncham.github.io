<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3DTZK1L6BY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-3DTZK1L6GBY');
</script>
  
</head>
<body>

  <header class="hero">
    <svg id="contours" class="contours" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="wrap hero-inner">
      <h1 id="site-name">Your name</h1>
      <p id="site-bio" class="bio"></p>
      <p class="links">
        <a id="link-linkedin" class="btn btn-solid" href="#" target="_blank" rel="noopener">Connect on LinkedIn</a>
        <a id="link-email" class="btn btn-line" href="#" hidden>Send an email</a>
      </p>
    </div>
    <p id="site-coords" class="coords"></p>
  </header>

  <div class="scalebar" aria-hidden="true"></div>

  <main class="wrap">
    <section aria-labelledby="gallery-title">
      <div class="gallery-head">
        <h2 id="gallery-title">Maps and projects</h2>
        <p id="count" class="count" aria-live="polite"></p>
      </div>

      <div id="filters" class="filters" role="group" aria-label="Filter projects by topic"></div>

      <ul id="grid" class="grid"></ul>
      <p id="empty" class="empty" hidden>No projects in this topic yet. Add one in projects.js.</p>
    </section>
  </main>

  <footer class="wrap footer">
    <p id="footer-text"></p>
  </footer>

  <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
    <button id="viewer-close" class="viewer-close" type="button">Close</button>
    <img id="viewer-img" alt="">
    <p id="viewer-title" class="viewer-title"></p>
  </dialog>

  <script src="projects.js"></script>
  <script>
  // Track clicks on links and buttons
  document.addEventListener('click', function (e) {
    const el = e.target.closest('a, button, [data-track]');
    if (!el) return;
    gtag('event', 'click_item', {
      item_text: (el.innerText || el.getAttribute('aria-label') || '').trim().slice(0, 80),
      item_url: el.href || '',
      item_id: el.id || ''
    });
  });

  // Track how far people scroll
  let marks = [25, 50, 75, 100], sent = {};
  window.addEventListener('scroll', function () {
    const pct = Math.round((window.scrollY + window.innerHeight) / document.documentElement.scrollHeight * 100);
    marks.forEach(m => {
      if (pct >= m && !sent[m]) {
        sent[m] = true;
        gtag('event', 'scroll_depth', { percent: m });
      }
    });
  }, { passive: true });

  // Track total time spent when the visitor leaves
  const start = Date.now();
  window.addEventListener('pagehide', function () {
    gtag('event', 'time_on_page', {
      seconds: Math.round((Date.now() - start) / 1000),
      transport_type: 'beacon'
    });
  });
</script>
  <script src="script.js"></script>
</body>
</html>
